{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить/редактировать партнера</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.15.7/dist/css/uikit.min.css" />
    <style>
         .logo {
        height: 52px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
            margin: 0;
            padding: 20px;
        }

        .uk-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }

        h1.uk-heading-divider {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            padding-bottom: 15px;
            border-bottom: 2px solid #67BA80;
            margin-bottom: 30px;
        }

        .uk-form-label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .uk-form-controls input,
        .uk-form-controls select,
        .uk-form-controls textarea {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .uk-form-controls input:focus,
        .uk-form-controls select:focus,
        .uk-form-controls textarea:focus {
            border-color: #67BA80;
            box-shadow: 0 0 0 2px rgba(103, 186, 128, 0.2);
            outline: none;
        }

        .uk-margin {
            margin-bottom: 20px;
        }

        button.uk-button-primary {
            background-color: #67BA80;
            color: white;
            border: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        button.uk-button-primary:hover {
            background-color: #5aa870;
            transform: translateY(-1px);
        }

        a.uk-button-default {
            background-color: white;
            border: 1px solid #67BA80;
            color: #67BA80;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        a.uk-button-default:hover {
            background-color: #67BA80;
            color: white;
            text-decoration: none;
        }

        .uk-margin-top {
            margin-top: 25px;
        }

        form {
            background-color: #F9F5EF;
            padding: 25px;
            border-radius: 6px;
            border: 1px solid #F4E8D3;
        }

        .uk-form-controls {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <img src="{% static 'logo.png' %}" alt="Логотип" class="logo">
    <div class="uk-container">
        <h1 class="uk-heading-divider">{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} партнера</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="uk-margin">
                <label for="id_name" class="uk-form-label">Наименование</label>
                <div class="uk-form-controls">
                    {{ form.name }}
                </div>
            </div>

            <div class="uk-margin">
                <label for="id_type" class="uk-form-label">Тип партнера</label>
                <div class="uk-form-controls">
                    {{ form.type }}
                </div>
            </div>

            <div class="uk-margin">
                <label for="id_rate" class="uk-form-label">Рейтинг</label>
                <div class="uk-form-controls">
                    {{ form.rate }}
                </div>
            </div>

            <div class="uk-margin">
                <label for="id_director" class="uk-form-label">Директор</label>
                <div class="uk-form-controls">
                    {{ form.director }}
                </div>
            </div>

            <div class="uk-margin">
                <label for="id_email" class="uk-form-label">Email</label>
                <div class="uk-form-controls">
                    {{ form.email }}
                </div>
            </div>

            <div class="uk-margin">
                <label for="id_phone_number" class="uk-form-label">Телефон</label>
                <div class="uk-form-controls">
                    {{ form.phone_number }}
                </div>
            </div>

            <div class="uk-margin">
                <label for="id_address" class="uk-form-label">Адрес</label>
                <div class="uk-form-controls">
                    {{ form.address }}
                </div>
            </div>

            <div class="uk-margin">
                <label for="id_inn" class="uk-form-label">ИНН</label>
                <div class="uk-form-controls">
                    {{ form.inn }}
                </div>
            </div>

            <button type="submit" class="uk-button uk-button-primary uk-margin-top">Сохранить</button>
        </form>
        <a href="{% url 'partner_list' %}" class="uk-button uk-button-default uk-margin-top">Назад</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.15.7/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.15.7/dist/js/uikit-icons.min.js"></script>
</body>
</html>
